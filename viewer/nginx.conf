server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: every unknown path is the app's own router's problem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
