name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & tests
    runs-on: ubuntu-latest

    services:
      # A real Postgres, because the schema uses partial unique indexes, array
      # containment and pg_trgm. Testing against SQLite would test something
      # other than what ships.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peblo -d peblo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@localhost:5432/peblo_test
      REFERENCE_PATH: ${{ github.workspace }}/data/reference.json
      SEED_PATH: ${{ github.workspace }}/data/seed_shows.json
      SEED_ASSETS_DIR: ${{ github.workspace }}/data/assets
      JWT_SECRET: ci-secret
      STORAGE_BACKEND: local
      # The default (/data/storage) only exists inside the Docker image, which
      # creates and chowns it. A bare runner cannot create /data, so point the
      # object store somewhere the job can actually write.
      #
      # `github.workspace`, not `runner.temp`: the `runner` context is not
      # available in job-level env, and referencing it there makes the whole
      # workflow file invalid -- GitHub then schedules no jobs at all.
      STORAGE_LOCAL_ROOT: ${{ github.workspace }}/.ci-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: api
        run: ruff check app tests

      - name: Migrations apply and roll back cleanly
        working-directory: api
        # A migration that cannot be undone is a migration you cannot deploy on
        # a Friday. This catches a broken downgrade before it matters.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        working-directory: api
        run: pytest --cov=app --cov-report=term-missing

  web:
    name: Web — typecheck, lint & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cms, viewer]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm install

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  images:
    name: Build image — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      fail-fast: false
      matrix:
        service: [api, cms, viewer]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: peblo/${{ matrix.service }}:${{ github.sha }}
          # Layer cache across runs; without it every PR reinstalls every
          # dependency from scratch.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    name: docker compose up actually works
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Bring the whole stack up
        # "docker-compose up not working" is on the list of things that count
        # against us, so it is checked on every commit rather than assumed.
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "api healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "api never became healthy"; docker compose logs --tail 100; exit 1

      - name: The seeded catalogue is actually being served
        run: |
          curl -fsS http://localhost:8000/catalog | python3 -c "
          import json, sys
          catalog = json.load(sys.stdin)
          assert catalog['shows'], 'catalogue is empty after seeding'
          assert catalog['sections'], 'no sections in the catalogue'
          print(f\"{len(catalog['shows'])} shows, {len(catalog['sections'])} sections\")
          "
          curl -fsS 'http://localhost:8000/catalog/search?q=kite' | grep -q '\"total\"'

      - name: Both UIs are being served
        run: |
          curl -fsS http://localhost:5173/ | grep -qi "peblo"
          curl -fsS http://localhost:5174/ | grep -qi "peblo"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- deploy
  #
  # Not wired to a real cloud — there isn't one for this exercise — but written
  # out so the shape of it is reviewable. What it does and why:
  #
  #  * `needs` every check above, so nothing deploys on a red build.
  #  * `environment: production` so GitHub holds it for a manual approval and
  #    reads the production secrets from that environment rather than from repo
  #    secrets that every workflow can see.
  #  * Migrations run as their own step, before the new image is rolled out, and
  #    the deploy stops if they fail. With more than one API replica the two
  #    cannot be the same step: a replica running the old code must survive the
  #    new schema, which is why migrations here are additive-only and a column
  #    is dropped a release *after* the code that used it.
  #  * The image is tagged with the commit SHA, never `latest`, so a rollback is
  #    "point at the previous SHA" and not "rebuild and hope".
  #  * The smoke check hits /health on the deployed URL, and a failure there
  #    fails the job, so a broken deploy is visible in CI instead of in Slack.
  deploy:
    name: Deploy (illustrative)
    runs-on: ubuntu-latest
    needs: [api, web, compose-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Push images to the registry
        run: |
          echo "docker build -t $REGISTRY/peblo-api:$GITHUB_SHA ./api"
          echo "docker push  $REGISTRY/peblo-api:$GITHUB_SHA"
          echo "# CMS and viewer are static bundles: build once per environment,"
          echo "# because VITE_API_BASE_URL is inlined at build time."
          echo "docker build --build-arg VITE_API_BASE_URL=$PROD_API_URL -t $REGISTRY/peblo-cms:$GITHUB_SHA ./cms"

      - name: Run migrations against production
        run: echo "alembic upgrade head   # separate task, own logs, fails the deploy loudly"

      - name: Roll out
        run: echo "deploy peblo-api:$GITHUB_SHA  # rolling, one replica at a time"

      - name: Smoke check the deployment
        run: echo "curl -fsS \$PROD_API_URL/health"
